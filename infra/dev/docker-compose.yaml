services:
  quizzer-db:
    image: postgres:17
    container_name: quizzer-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - "../database:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - application

  quizzer-backend:
    container_name: quizzer-backend
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PORT: ${PORT}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
    networks:
      - application
    ports:
      - "8080:8080"

  quizzer-frontend:
    container_name: quizzer-frontend
    build:
      context: ../../frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://quizzer-backend:8080/api/v1
        - API_BASE_URL=http://quizzer-backend:8080/api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://quizzer-backend:8080/api/v1
      API_BASE_URL: http://quizzer-backend:8080/api/v1
    networks:
      - application
    ports:
      - "3000:3000"

volumes:
  database:

networks:
  application:
